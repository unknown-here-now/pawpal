<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065F46" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>
    <linearGradient id="pawGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="handGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Rounded Maskable Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Stylized Animal Paw interlocking with Helping Human Hand -->
  <g filter="url(#shadow)" transform="translate(32, 32)">
    <!-- Human Hand Silhouette supporting the paw -->
    <path d="M 120 280 C 120 200, 200 180, 240 240 C 260 270, 290 280, 320 280 C 350 280, 380 250, 380 200 C 380 150, 340 120, 290 120 C 230 120, 200 160, 200 200" stroke="url(#handGrad)" stroke-width="32" stroke-linecap="round" fill="none" opacity="0.9"/>
    
    <!-- Central Paw Pad (Amber Gold) -->
    <path d="M 210 270 C 210 250, 250 250, 250 270 C 250 290, 210 290, 210 270 Z" fill="url(#pawGrad)"/>
    <!-- Outer Paw pads -->
    <circle cx="190" cy="240" r="14" fill="url(#pawGrad)"/>
    <circle cx="215" cy="225" r="14" fill="url(#pawGrad)"/>
    <circle cx="245" cy="225" r="14" fill="url(#pawGrad)"/>
    <circle cx="270" cy="240" r="14" fill="url(#pawGrad)"/>
  </g>
</svg>
